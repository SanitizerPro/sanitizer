name: Build EVTX WASM

on:
push:
branches:
- main
paths:
- "evtx-wasm/**"
- ".github/workflows/build-evtx-wasm.yml"

workflow_dispatch:

permissions:
contents: write

concurrency:
group: evtx-wasm
cancel-in-progress: true

jobs:
build:
name: Build EVTX parser
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install Rust
    uses: dtolnay/rust-toolchain@stable
    with:
      targets: wasm32-unknown-unknown

  - name: Install wasm-bindgen-cli
    run: |
      cargo install wasm-bindgen-cli --version 0.2.105

  - name: Build WASM
    working-directory: evtx-wasm
    run: |
      cargo build \
        --release \
        --target wasm32-unknown-unknown

  - name: Prepare WASM directory
    run: |
      rm -rf public/wasm
      mkdir -p public/wasm

  - name: Generate JavaScript bindings
    working-directory: evtx-wasm
    run: |
      wasm-bindgen \
        target/wasm32-unknown-unknown/release/sanitizer_evtx_wasm.wasm \
        --target web \
        --out-dir ../public/wasm \
        --out-name sanitizer_evtx

  - name: Verify artifacts
    run: |
      test -f public/wasm/sanitizer_evtx.js
      test -f public/wasm/sanitizer_evtx_bg.wasm

  - name: Commit generated artifacts
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add public/wasm

      if git diff --cached --quiet; then
        echo "No WASM changes."
        exit 0
      fi

      git commit -m "build: update EVTX WASM parser"
      git push
```
