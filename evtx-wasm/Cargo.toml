[package]
name = "sanitizer-evtx-wasm"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
evtx = {
git = "https://github.com/omerbenamram/evtx.git",
tag = "v0.12.3",
default-features = false
}

wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
